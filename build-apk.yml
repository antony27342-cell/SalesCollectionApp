
name: Build Sales Collection Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q SalesCollectionManager_Android_Project_v4.zip -d project

      - name: Build APK
        run: |
          cd project/SalesCollectionManager
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesCollectionManager-APK
          path: project/SalesCollectionManager/app/build/outputs/apk/debug/*.apk
